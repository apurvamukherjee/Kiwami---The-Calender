<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kiwami</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>html{background:#0a0a0d}</style>
    <script>
      // Apply the cached theme before first paint so a light-theme reload
      // doesn't flash the default dark background. Dexie remains the source
      // of truth (see src/hooks/useSettings.ts) — this is purely a paint cache.
      (function () {
        try {
          var m = localStorage.getItem("kiwami-theme");
          if (m === "light") {
            var d = document.documentElement;
            d.setAttribute("data-theme", "light");
            d.style.background = "#f7f5f2";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
